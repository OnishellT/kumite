name: CI

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-tests:
    name: quality-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Go static-analysis tools
        run: make install-go-tools

      - name: Check formatting
        run: make format-check

      - name: Run tests
        run: make test

      - name: Run static analysis
        run: make static-analysis

  build:
    name: build
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: quality-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build local binaries
        run: make build

      - name: Build release matrix
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/kumite-linux-amd64 ./cmd/kumite
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/kumite-linux-arm64 ./cmd/kumite
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/kumite-darwin-amd64 ./cmd/kumite
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/kumite-darwin-arm64 ./cmd/kumite
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/kumite-windows-amd64.exe ./cmd/kumite

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kumite-build-${{ github.sha }}
          path: dist/*
